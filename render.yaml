# =============================================
# LogiFlow CRM - Render.com Blueprint
# Deploy completo: Backend + Frontend + DB + Redis
# =============================================

services:
  # ========================================
  # Backend - FastAPI
  # ========================================
  - type: web
    name: logiflow-api
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: |
      cd "LogiFlow CRM/backend"
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: |
      cd "LogiFlow CRM/backend"
      uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logiflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: logiflow-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: DEBUG
        value: false
      - key: API_PREFIX
        value: /api
      - key: API_VERSION
        value: v1
      - key: ALLOWED_ORIGINS
        value: "*"

  # ========================================
  # Frontend - Vue 3 (Static Site)
  # ========================================
  - type: web
    name: logiflow-frontend
    env: static
    region: oregon
    plan: starter
    branch: main
    buildCommand: |
      cd "LogiFlow CRM/frontend"
      npm install
      npm run build
    staticPublishPath: LogiFlow CRM/frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://logiflow-api.onrender.com/api/*
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block

  # ========================================
  # Redis
  # ========================================
  - type: redis
    name: logiflow-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ========================================
# Database - PostgreSQL
# ========================================
databases:
  - name: logiflow-db
    databaseName: logiflow
    plan: starter
    region: oregon
    ipAllowList: []
