version: '3.8'

services:
  # ===========================================
  # BANCO DE DADOS
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: logiflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logiflow
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: logiflow123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiflow -d logiflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # REDIS
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis
    restart: unless-stopped
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - logiflow_network

  # ===========================================
  # BACKEND API - FastAPI
  # ===========================================
  api:
    image: python:3.11-slim
    container_name: logiflow_api
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install fastapi uvicorn[standard] redis requests loguru pydantic-settings &&
             uvicorn main_simples:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis
    networks:
      - logiflow_network

volumes:
  postgres_data:
  redis_data:

networks:
  logiflow_network:
    driver: bridge
