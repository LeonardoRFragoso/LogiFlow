# Ruff configuration for LogiFlow CRM Backend
# Documentation: https://docs.astral.sh/ruff/

# Target Python version
target-version = "py311"

# Line length
line-length = 120

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
    ".pytest_cache",
    "*.egg-info",
]

[lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "S101",   # use of assert (needed for tests)
    "S105",   # hardcoded password (false positives in tests)
    "S106",   # hardcoded password (false positives in tests)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
# Tests can use assert and have different requirements
"tests/**/*.py" = ["S101", "S105", "S106", "T20"]
# Alembic migrations have specific patterns
"alembic/**/*.py" = ["E501", "F401"]
# Config files may have unused imports
"config.py" = ["F401"]

[lint.isort]
known-first-party = ["domain", "application", "infrastructure", "presentation", "routers", "services", "models"]
force-single-line = false
combine-as-imports = true

[format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix line endings
line-ending = "lf"

# Enable auto-formatting of docstrings
docstring-code-format = true
