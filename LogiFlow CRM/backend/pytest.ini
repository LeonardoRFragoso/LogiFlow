[pytest]
# Configuração do pytest para LogiFlow CRM

# Diretórios a serem testados
testpaths = tests

# Padrão de nomes de arquivos de teste
python_files = test_*.py

# Padrão de classes de teste
python_classes = Test*

# Padrão de funções de teste
python_functions = test_*

# Opções padrão
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-exclude=tests/*
    --cov-exclude=alembic/*
    --cov-exclude=venv/*

# Markers personalizados
markers =
    unit: Testes unitários
    integration: Testes de integração
    slow: Testes lentos
    auth: Testes de autenticação
    multitenancy: Testes de multi-tenancy
    billing: Testes de billing
    external: Testes que dependem de APIs externas

# Configuração de log
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configuração de cobertura
[coverage:run]
omit = 
    */tests/*
    */alembic/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

