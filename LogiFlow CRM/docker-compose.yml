services:
  # ===========================================
  # BANCO DE DADOS - PostgreSQL
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: logiflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logiflow}
      POSTGRES_USER: ${DB_USER:-logiflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logiflow123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logiflow} -d ${DB_NAME:-logiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # CACHE - Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # BACKEND API - FastAPI
  # ===========================================
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_api
    restart: unless-stopped
    user: "0:0"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-logiflow}
      - DB_USER=${DB_USER:-logiflow}
      - DB_PASSWORD=${DB_PASSWORD:-logiflow123}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - FOCUSNFE_TOKEN=${FOCUSNFE_TOKEN:-}
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logiflow_network
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================
  # FRONTEND - Vue.js (App CRM)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: logiflow_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - logiflow_network

  # ===========================================
  # SITE DE DIVULGAÇÃO - Vue.js
  # ===========================================
  site:
    build:
      context: ./site-divulgacao
      dockerfile: ../docker/site/Dockerfile
    container_name: logiflow_site
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - logiflow_network

  # ===========================================
  # WORKER - Celery (Tarefas Assíncronas)
  # ===========================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_celery_worker
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-logiflow}
      - DB_USER=${DB_USER:-logiflow}
      - DB_PASSWORD=${DB_PASSWORD:-logiflow123}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    volumes:
      - ./backend:/app
      - ./docker/celery/start-worker.sh:/start-worker.sh:ro
    depends_on:
      - redis
      - db
    networks:
      - logiflow_network
    command: sh /start-worker.sh

  # ===========================================
  # SCHEDULER - Celery Beat
  # ===========================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_celery_beat
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-logiflow}
      - DB_USER=${DB_USER:-logiflow}
      - DB_PASSWORD=${DB_PASSWORD:-logiflow123}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - logiflow_network
    command: celery -A celery_app beat --loglevel=info

  # ===========================================
  # ADMINER - Gerenciador de Banco (Dev Only)
  # ===========================================
  adminer:
    image: adminer:latest
    container_name: logiflow_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - db
    networks:
      - logiflow_network
    profiles:
      - dev

# ===========================================
# VOLUMES PERSISTENTES
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ===========================================
# REDE
# ===========================================
networks:
  logiflow_network:
    driver: bridge
