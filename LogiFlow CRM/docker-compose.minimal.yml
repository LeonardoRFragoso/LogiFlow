services:
  # Banco de Dados Principal (Backend FastAPI)
  db:
    image: mariadb:10.6
    container_name: logiflow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: logiflow_crm
      MYSQL_USER: logiflow
      MYSQL_PASSWORD: logiflow123
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banco de Dados SuiteCRM (separado)
  suitecrm_db:
    image: mariadb:10.6
    container_name: logiflow_suitecrm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm_user
      MYSQL_PASSWORD: suitecrm123
    volumes:
      - suitecrm_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SuiteCRM
  suitecrm:
    build:
      context: ./docker/suitecrm
      dockerfile: Dockerfile
    container_name: logiflow_suitecrm
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://suitecrm_user:suitecrm123@suitecrm_db/suitecrm
      - SITE_URL=http://localhost:8080
      - LEGACY_SESSION_NAME=LEGACYSESSID
    volumes:
      - ./suitecrm:/var/www/html
      - ./docker/suitecrm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      suitecrm_db:
        condition: service_healthy
    networks:
      - logiflow_network

  # Nginx
  nginx:
    image: nginx:stable-alpine
    container_name: logiflow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./suitecrm:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites:/etc/nginx/conf.d:ro
    depends_on:
      - suitecrm
    networks:
      - logiflow_network

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_api
    restart: unless-stopped
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-change-this
      - DB_HOST=db
      - DB_NAME=logiflow_crm
      - DB_USER=logiflow
      - DB_PASSWORD=logiflow123
      - REDIS_URL=redis://:redis123@redis:6379/1
      - DATABASE_URL=mysql://logiflow:logiflow123@db:3306/logiflow_crm
      - SUITECRM_URL=http://nginx:80
      - SUITECRM_CLIENT_ID=b8445d29-da7c-11f0-8e56-d6ca7fd38528
      - SUITECRM_CLIENT_SECRET=logiflow_secret_2024
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logiflow_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mariadb_data:
  suitecrm_db_data:
  redis_data:

networks:
  logiflow_network:
    driver: bridge
