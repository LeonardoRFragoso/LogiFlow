# =============================================
# LogiFlow CRM - Site Configuration
# =============================================

# Upstream para PHP-FPM
upstream php-fpm {
    server suitecrm:9000;
}

# Upstream para FastAPI
upstream fastapi {
    server api:8000;
}

server {
    listen 80;
    server_name localhost;
    
    root /var/www/html/public;
    index index.php index.html;

    # Logs por site
    access_log /var/log/nginx/logiflow_access.log main;
    error_log /var/log/nginx/logiflow_error.log;

    # =========================================
    # API Backend (FastAPI) - /api/*
    # =========================================
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://fastapi/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # =========================================
    # SuiteCRM API V8 - /Api/*
    # =========================================
    location ^~ /Api/ {
        try_files $uri $uri/ /index.php?$args;
    }

    # =========================================
    # SuiteCRM - Static Files
    # =========================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================================
    # SuiteCRM - PHP Files
    # =========================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # =========================================
    # SuiteCRM - Main Routes
    # =========================================
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # =========================================
    # Security - Block sensitive files
    # =========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(config|cache|logs|tmp)/ {
        deny all;
    }

    location ~* \.(yml|yaml|json|lock|md|sql|sh|bak|swp)$ {
        deny all;
    }

    # =========================================
    # Health Check
    # =========================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
