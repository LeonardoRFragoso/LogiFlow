services:
  # ===========================================
  # BANCO DE DADOS - PostgreSQL
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: logiflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logiflow}
      POSTGRES_USER: ${POSTGRES_USER:-logiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logiflow123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiflow} -d ${POSTGRES_DB:-logiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # CACHE - Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # BACKEND API - FastAPI
  # ===========================================
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_api
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-logiflow}
      - DB_USER=${POSTGRES_USER:-logiflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-logiflow123}
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logiflow_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================
  # FRONTEND - Vue.js (Sistema Web CRM)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: logiflow_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - logiflow_network

  # ===========================================
  # SITE DE DIVULGAÇÃO - Vue.js
  # ===========================================
  site:
    build:
      context: ./site-divulgacao
      dockerfile: ../docker/site/Dockerfile
    container_name: logiflow_site
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - logiflow_network

  # ===========================================
  # APP MOTORISTA - Vue.js PWA
  # ===========================================
  app-motorista:
    build:
      context: .
      dockerfile: docker/app-motorista/Dockerfile
    container_name: logiflow_app_motorista
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - logiflow_network

  # ===========================================
  # PORTAL CLIENTE - Vue.js
  # ===========================================
  portal-cliente:
    build:
      context: .
      dockerfile: docker/portal-cliente/Dockerfile
    container_name: logiflow_portal_cliente
    restart: unless-stopped
    ports:
      - "3003:80"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - logiflow_network

  # ===========================================
  # WORKER - Celery (Tarefas Assíncronas)
  # ===========================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_celery_worker
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-logiflow}
      - DB_USER=${POSTGRES_USER:-logiflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-logiflow123}
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    networks:
      - logiflow_network
    command: celery -A worker worker --loglevel=info

  # ===========================================
  # SCHEDULER - Celery Beat
  # ===========================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_celery_beat
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-logiflow}
      - DB_USER=${POSTGRES_USER:-logiflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-logiflow123}
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    networks:
      - logiflow_network
    command: celery -A worker beat --loglevel=info

  # ===========================================
  # ADMINER - Gerenciador de Banco (Dev Only)
  # ===========================================
  adminer:
    image: adminer:latest
    container_name: logiflow_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - db
    networks:
      - logiflow_network
    profiles:
      - dev

# ===========================================
# VOLUMES PERSISTENTES
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ===========================================
# REDE
# ===========================================
networks:
  logiflow_network:
    driver: bridge
