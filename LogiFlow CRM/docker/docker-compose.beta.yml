services:
  # Banco de Dados Principal
  db:
    image: postgres:15-alpine
    container_name: logiflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logiflow
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: logiflow123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiflow -d logiflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_api
    restart: unless-stopped
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-change-this-in-production
      - DB_HOST=db
      - DB_NAME=logiflow
      - DB_USER=logiflow
      - DB_PASSWORD=logiflow123
      - DB_PORT=5432
      - REDIS_URL=redis://:redis123@redis:6379/1
      - DATABASE_URL=postgresql://logiflow:logiflow123@db:5432/logiflow
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logiflow_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  logiflow_network:
    driver: bridge
