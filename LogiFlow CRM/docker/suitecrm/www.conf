; =============================================
; LogiFlow CRM - PHP-FPM Pool Configuration
; =============================================

[www]
user = www
group = www

listen = 9000
listen.owner = www
listen.group = www
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Status e ping para health checks
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Logging
access.log = /var/log/php/access.log
slowlog = /var/log/php/slow.log
request_slowlog_timeout = 10s

; Limpar variáveis de ambiente
clear_env = no

; Capturar erros do worker
catch_workers_output = yes
decorate_workers_output = no

; Segurança
security.limit_extensions = .php

; Environment variables
env[DB_HOST] = $DB_HOST
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD] = $DB_PASSWORD
env[SITE_URL] = $SITE_URL
