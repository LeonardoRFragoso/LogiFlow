version: '3.8'

# ============================================
# LOGIFLOW CRM - STACK COMPLETO DE PRODUÇÃO
# ============================================
# Todos os componentes necessários para rodar o sistema completo

services:
  # ===========================================
  # BANCO DE DADOS - PostgreSQL
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: logiflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logiflow}
      POSTGRES_USER: ${POSTGRES_USER:-logiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logiflow123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiflow} -d ${POSTGRES_DB:-logiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ===========================================
  # CACHE - Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # ===========================================
  # BACKEND API - FastAPI
  # ===========================================
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_api
    restart: unless-stopped
    user: "0:0"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:5173,http://localhost:8080
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-logiflow}
      - DB_USER=${POSTGRES_USER:-logiflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-logiflow123}
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - FOCUSNFE_TOKEN=${FOCUSNFE_TOKEN:-}
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logiflow_network
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # FRONTEND 1 - Sistema Principal (Vue.js)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: logiflow_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # FRONTEND 2 - App Motorista (Vue.js)
  # ===========================================
  app-motorista:
    build:
      context: ./app-motorista
      dockerfile: ../docker/app-motorista/Dockerfile
    container_name: logiflow_app_motorista
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # FRONTEND 3 - Site Divulgação (Vue.js)
  # ===========================================
  site-divulgacao:
    build:
      context: ./site-divulgacao
      dockerfile: ../docker/site/Dockerfile
    container_name: logiflow_site
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # FRONTEND 4 - Portal Cliente (Vue.js)
  # ===========================================
  portal-cliente:
    build:
      context: ./portal-cliente
      dockerfile: ../docker/portal-cliente/Dockerfile
    container_name: logiflow_portal_cliente
    restart: unless-stopped
    ports:
      - "3003:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # WORKER - Celery (Tarefas Assíncronas)
  # ===========================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_celery_worker
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-logiflow}
      - DB_USER=${POSTGRES_USER:-logiflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-logiflow123}
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - logiflow_network
    command: celery -A worker worker --loglevel=info
    profiles:
      - full

  # ===========================================
  # SCHEDULER - Celery Beat
  # ===========================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_celery_beat
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-logiflow}
      - DB_USER=${POSTGRES_USER:-logiflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-logiflow123}
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - logiflow_network
    command: celery -A worker beat --loglevel=info
    profiles:
      - full

  # ===========================================
  # ADMINER - Gerenciador de Banco (Dev)
  # ===========================================
  adminer:
    image: adminer:latest
    container_name: logiflow_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - db
    networks:
      - logiflow_network
    profiles:
      - dev

  # ===========================================
  # REDIS COMMANDER - Gerenciador Redis (Dev)
  # ===========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: logiflow_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis123}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - logiflow_network
    profiles:
      - dev

  # ===========================================
  # PROMETHEUS - Coleta de Métricas
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: logiflow_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # GRAFANA - Dashboards de Monitoramento
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: logiflow_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana123}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3004:3000"
    depends_on:
      - prometheus
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

# ===========================================
# VOLUMES PERSISTENTES
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ===========================================
# REDE
# ===========================================
networks:
  logiflow_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
