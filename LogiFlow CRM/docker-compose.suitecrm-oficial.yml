services:
  # Banco de Dados
  db:
    image: mariadb:10.6
    container_name: logiflow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: suitecrm123
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SuiteCRM - Imagem Oficial SalesAgility
  suitecrm:
    image: salesagility/suitecrm:latest
    container_name: logiflow_suitecrm
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Database
      DATABASE_TYPE: mysql
      DATABASE_HOST: db
      DATABASE_NAME: suitecrm
      DATABASE_USER: suitecrm
      DATABASE_PASSWORD: suitecrm123
      
      # Site URL
      SITE_URL: http://localhost:8080
      
      # Admin (será criado no primeiro acesso via web)
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
    volumes:
      - suitecrm_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logiflow_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: logiflow_api
    restart: unless-stopped
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-change-this
      - DB_HOST=db
      - DB_NAME=suitecrm
      - DB_USER=suitecrm
      - DB_PASSWORD=suitecrm123
      - REDIS_URL=redis://:redis123@redis:6379/1
      - SUITECRM_URL=http://suitecrm:8080
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      suitecrm:
        condition: service_started
    networks:
      - logiflow_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
  suitecrm_data:
  redis_data:

networks:
  logiflow_network:
    driver: bridge
