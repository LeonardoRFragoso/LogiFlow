# =============================================
# LogiFlow CRM - SuiteCRM Docker Compose
# =============================================
# Execute: docker compose -f docker-compose.suitecrm.yml up -d
# Acesse: http://localhost:8080

services:
  # ========== Database ==========
  suitecrm_db:
    image: mariadb:10.6
    container_name: logiflow_suitecrm_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${DB_NAME:-suitecrm}
      MYSQL_USER: ${DB_USER:-suitecrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-suitecrm123}
    volumes:
      - suitecrm_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - logiflow_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== SuiteCRM 7.14 ==========
  suitecrm:
    image: salesagility/suitecrm:7.14
    container_name: logiflow_suitecrm
    restart: unless-stopped
    environment:
      # Database
      DATABASE_HOST: suitecrm_db
      DATABASE_NAME: ${DB_NAME:-suitecrm}
      DATABASE_USER: ${DB_USER:-suitecrm}
      DATABASE_PASSWORD: ${DB_PASSWORD:-suitecrm123}
      # Site URL
      SITE_URL: http://localhost:8080
    volumes:
      - suitecrm_data:/var/www/html
    ports:
      - "8080:80"
    networks:
      - logiflow_network
    depends_on:
      suitecrm_db:
        condition: service_healthy

networks:
  logiflow_network:
    driver: bridge

volumes:
  suitecrm_db_data:
  suitecrm_data:
