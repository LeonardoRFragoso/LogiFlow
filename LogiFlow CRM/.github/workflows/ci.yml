name: CI - LogiFlow CRM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ================================
  # Backend Tests
  # ================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: logiflow
          POSTGRES_PASSWORD: logiflow123
          POSTGRES_DB: logiflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'LogiFlow CRM/backend/requirements.txt'

      - name: Install dependencies
        working-directory: LogiFlow CRM/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: LogiFlow CRM/backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logiflow_test
          DB_USER: logiflow
          DB_PASSWORD: logiflow123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python -m pytest tests/unit/ -v --tb=short --junitxml=test-results.xml

      - name: Run integration tests
        working-directory: LogiFlow CRM/backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logiflow_test
          DB_USER: logiflow
          DB_PASSWORD: logiflow123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/unit/ -k "not smoke" || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: LogiFlow CRM/backend/test-results.xml

  # ================================
  # Backend Lint & Type Check
  # ================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run Ruff (linter)
        working-directory: LogiFlow CRM/backend
        run: ruff check . --output-format=github || true

      - name: Run Ruff (formatter check)
        working-directory: LogiFlow CRM/backend
        run: ruff format --check . || true

  # ================================
  # Frontend Tests
  # ================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'LogiFlow CRM/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: LogiFlow CRM/frontend
        run: npm ci

      - name: Run linter
        working-directory: LogiFlow CRM/frontend
        run: npm run lint || true

      - name: Build frontend
        working-directory: LogiFlow CRM/frontend
        run: npm run build

  # ================================
  # Docker Build Test
  # ================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: LogiFlow CRM/backend
          file: LogiFlow CRM/docker/api/Dockerfile
          push: false
          tags: logiflow-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================
  # Security Scan
  # ================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'LogiFlow CRM/'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
