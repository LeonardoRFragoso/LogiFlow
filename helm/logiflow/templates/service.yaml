apiVersion: v1
kind: Service
metadata:
  name: {{ include "logiflow.fullname" . }}-backend
  labels:
    {{- include "logiflow.labels" . | nindent 4 }}
    component: backend
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "logiflow.selectorLabels" . | nindent 4 }}
    component: backend

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "logiflow.fullname" . }}-frontend
  labels:
    {{- include "logiflow.labels" . | nindent 4 }}
    component: frontend
  {{- with .Values.frontend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "logiflow.selectorLabels" . | nindent 4 }}
    component: frontend
